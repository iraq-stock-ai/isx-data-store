name: تحديث أسعار ISX

on:
  schedule:
    - cron: '0 11 * * 0-4'
    - cron: '0 13 * * 0-4'
    - cron: '0 17 * * 0-4'
    - cron: '0 6 * * 0-4'

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    if: |
      github.event.schedule == '0 11 * * 0-4' ||
      github.event.schedule == '0 13 * * 0-4' ||
      github.event.schedule == '0 17 * * 0-4' ||
      github.event.schedule == '0 6 * * 0-4' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4 openpyxl lxml

      - name: تحديث الأسعار
        run: |
          python isx_daily_update.py \
            --existing isx_history_all.json \
            --output isx_history_all.json

      - name: فحص التغييرات
        id: check_changes
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit ورفع تحديثات الأسعار
        if: always() && steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "isx-data-bot"
          git config user.email "actions@github.com"
          git add isx_history_all.json
          git commit -m "تحديث تلقائي للأسعار - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
