name: RSI Daily Monitor

# يشتغل يوميًا بعد تحديث isx_history_all.json (يتحدث من الساعة 5 مساءً بتوقيت
# بغداد فما فوق حسب تأكيدك). نجدوله بعدها بهامش أمان كافٍ.
# ملاحظة: أوقات GitHub Actions cron كلها UTC. توقيت بغداد = UTC+3 (بدون توقيت صيفي).
# 18:00 بتوقيت بغداد = 15:00 UTC. نشغّل الووركفلو الساعة 15:00 UTC
# (18:00 بتوقيت بغداد) كهامش أمان بعد موعد التحديث المتوقع (5 مساءً فما فوق).
on:
  schedule:
    - cron: '0 15 * * 0,1,2,3,4'   # الأحد-الخميس (أيام تداول سوق العراق)، 15:00 UTC = 18:00 بغداد
  workflow_dispatch: {}             # يسمح بتشغيل يدوي من تبويب Actions للاختبار

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RSI monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python rsi-monitor/rsi_monitor.py isx_history_all.json isx_rsi_lows.json

      - name: Commit updated lows database
        run: |
          git config user.name "rsi-monitor-bot"
          git config user.email "actions@github.com"
          git add isx_rsi_lows.json
          git diff --staged --quiet && echo "لا تغييرات لترحيلها" || git commit -m "تحديث قاعدة قيعان RSI - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
